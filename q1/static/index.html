<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大文件上传</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dde5;
      --text: #1e2530;
      --muted: #687285;
      --accent: #1f7a5c;
      --accent-dark: #155f47;
      --danger: #b42318;
      --shadow: 0 10px 30px rgba(23, 31, 44, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 28px auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 760;
    }
    .upload-zone {
      display: grid;
      place-items: center;
      min-height: 210px;
      border: 1px dashed #9aa5b5;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      transition: border-color .16s ease, background .16s ease;
    }
    .upload-zone.dragover {
      border-color: var(--accent);
      background: #eef8f3;
    }
    .zone-inner {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    .zone-title {
      font-size: 17px;
      font-weight: 700;
    }
    .zone-meta {
      color: var(--muted);
      font-size: 13px;
    }
    input[type=file] { display: none; }
    button, .pick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 14px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    button.primary, .pick {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover, .pick:hover { background: var(--accent-dark); }
    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
    .queue {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .queue-header, .row {
      display: grid;
      grid-template-columns: minmax(190px, 1.5fr) 110px minmax(190px, 1fr) 120px 176px;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }
    .queue-header {
      background: #f0f2f5;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .row {
      border-top: 1px solid var(--line);
      min-height: 72px;
    }
    .file-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: #e8ebf0;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .18s ease;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .link {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }
    .error { color: var(--danger); }
    @media (max-width: 860px) {
      main { width: min(100vw - 20px, 680px); margin-top: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .queue-header { display: none; }
      .row {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 16px;
      }
      .actions { justify-content: flex-start; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>大文件上传</h1>
    <div class="muted">分片大小 <span id="chunkSizeText"></span></div>
  </div>

  <section class="upload-zone" id="dropZone">
    <div class="zone-inner">
      <div class="zone-title">拖入文件</div>
      <div class="zone-meta">支持断点续传和相同文件秒传</div>
      <label class="pick" for="fileInput">选择文件</label>
      <input id="fileInput" type="file" multiple>
    </div>
  </section>

  <section class="queue" id="queue" hidden>
    <div class="queue-header">
      <div>文件</div>
      <div>大小</div>
      <div>进度</div>
      <div>状态</div>
      <div></div>
    </div>
    <div id="rows"></div>
  </section>
</main>

<script>
const CHUNK_SIZE = {{.DefaultChunkSize}};
const rows = document.querySelector("#rows");
const queue = document.querySelector("#queue");
const fileInput = document.querySelector("#fileInput");
const dropZone = document.querySelector("#dropZone");
document.querySelector("#chunkSizeText").textContent = formatBytes(CHUNK_SIZE);

const tasks = new Map();

fileInput.addEventListener("change", () => addFiles(fileInput.files));
["dragenter", "dragover"].forEach(name => dropZone.addEventListener(name, event => {
  event.preventDefault();
  dropZone.classList.add("dragover");
}));
["dragleave", "drop"].forEach(name => dropZone.addEventListener(name, event => {
  event.preventDefault();
  dropZone.classList.remove("dragover");
}));
dropZone.addEventListener("drop", event => addFiles(event.dataTransfer.files));

function addFiles(files) {
  for (const file of files) {
    const id = `${file.name}-${file.size}-${file.lastModified}-${Math.random()}`;
    const task = {
      id,
      file,
      hash: "",
      uploaded: new Set(),
      totalChunks: Math.max(1, Math.ceil(file.size / CHUNK_SIZE)),
      running: false,
      paused: false,
      completed: false,
      controller: null,
    };
    tasks.set(id, task);
    renderTask(task);
    startTask(task);
  }
  queue.hidden = tasks.size === 0;
  fileInput.value = "";
}

function renderTask(task) {
  let row = document.getElementById(task.id);
  if (!row) {
    row = document.createElement("div");
    row.className = "row";
    row.id = task.id;
    row.innerHTML = `
      <div>
        <div class="file-name"></div>
        <div class="muted hash"></div>
      </div>
      <div class="muted size"></div>
      <div>
        <div class="bar"><div class="fill"></div></div>
        <div class="muted percent"></div>
      </div>
      <div class="muted status"></div>
      <div class="actions">
        <button class="pause">暂停</button>
        <button class="primary resume">继续</button>
        <a class="link" hidden target="_blank" rel="noreferrer">打开</a>
      </div>`;
    rows.prepend(row);
    row.querySelector(".pause").addEventListener("click", () => pauseTask(task));
    row.querySelector(".resume").addEventListener("click", () => startTask(task));
  }
  const percent = task.completed ? 100 : Math.floor(task.uploaded.size / task.totalChunks * 100);
  row.querySelector(".file-name").textContent = task.file.name;
  row.querySelector(".hash").textContent = task.hash ? task.hash.slice(0, 16) + "..." : "";
  row.querySelector(".size").textContent = formatBytes(task.file.size);
  row.querySelector(".fill").style.width = `${percent}%`;
  row.querySelector(".percent").textContent = `${percent}% (${task.uploaded.size}/${task.totalChunks})`;
  row.querySelector(".status").textContent = task.status || "等待";
  row.querySelector(".status").classList.toggle("error", task.error === true);
  row.querySelector(".pause").disabled = !task.running || task.completed;
  row.querySelector(".resume").disabled = task.running || task.completed;
  const link = row.querySelector(".link");
  link.hidden = !task.fileUrl;
  if (task.fileUrl) link.href = task.fileUrl;
}

async function startTask(task) {
  if (task.running || task.completed) return;
  task.running = true;
  task.paused = false;
  task.error = false;
  try {
    if (!task.hash) {
      task.status = "计算哈希";
      renderTask(task);
      task.hash = await sha256File(task.file);
    }
    task.status = "查询状态";
    renderTask(task);
    const init = await postJSON("/api/upload/init", {
      fileName: task.file.name,
      fileSize: task.file.size,
      fileHash: task.hash,
      chunkSize: CHUNK_SIZE,
      totalChunks: task.totalChunks
    });
    for (const index of init.uploadedChunks || []) task.uploaded.add(index);
    if (init.instant || init.completed) {
      task.completed = true;
      task.fileUrl = init.fileUrl;
      task.status = "已完成";
      renderTask(task);
      return;
    }
    await uploadChunks(task);
    if (!task.paused) {
      task.status = "合并文件";
      renderTask(task);
      const done = await postJSON("/api/upload/complete", {fileHash: task.hash});
      task.completed = done.completed;
      task.fileUrl = done.fileUrl;
      task.status = "已完成";
    }
  } catch (error) {
    task.error = true;
    task.status = error.message || "上传失败";
  } finally {
    task.running = false;
    task.controller = null;
    renderTask(task);
  }
}

async function uploadChunks(task) {
  for (let index = 0; index < task.totalChunks; index++) {
    if (task.paused) return;
    if (task.uploaded.has(index)) continue;
    task.status = `上传分片 ${index + 1}/${task.totalChunks}`;
    renderTask(task);
    const start = index * CHUNK_SIZE;
    const blob = task.file.slice(start, Math.min(task.file.size, start + CHUNK_SIZE));
    const form = new FormData();
    form.append("fileHash", task.hash);
    form.append("index", String(index));
    form.append("chunk", blob, `${task.file.name}.part${index}`);
    task.controller = new AbortController();
    const response = await fetch("/api/upload/chunk", {
      method: "POST",
      body: form,
      signal: task.controller.signal
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || "chunk upload failed");
    for (const uploadedIndex of body.uploadedChunks || []) task.uploaded.add(uploadedIndex);
    renderTask(task);
  }
}

function pauseTask(task) {
  task.paused = true;
  task.status = "已暂停";
  if (task.controller) task.controller.abort();
  renderTask(task);
}

async function sha256File(file) {
  const buffer = await file.arrayBuffer();
  const digest = await crypto.subtle.digest("SHA-256", buffer);
  return [...new Uint8Array(digest)].map(n => n.toString(16).padStart(2, "0")).join("");
}

async function postJSON(url, payload) {
  const response = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || "request failed");
  return body;
}

function formatBytes(value) {
  if (value === 0) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  const index = Math.min(units.length - 1, Math.floor(Math.log(value) / Math.log(1024)));
  return `${(value / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 2)} ${units[index]}`;
}
</script>
</body>
</html>
